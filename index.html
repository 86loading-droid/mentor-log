<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동행 기록 멘토링</title>
<meta name="description" content="특수교육학부 멘토-멘티 1:1 학습 점검 웹앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<!--HEAD-END-->
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E8EEE9; --ink:#17221E; --muted:#5B6862; --line:#D3DCD5;
  --accent:#2E6A54; --accent-ink:#FFFFFF; --accent-soft:#DAEAE1;
  --ax1:#2E6A54; --ax2:#B2761C; --ax3:#566BB0;
  --lv1:#CFDDD4; --lv2:#93BCA6; --lv3:#4E8E71; --lv4:#22573F;
  --ok:#2C7A4B; --warn:#A95A0B; --warn-soft:#F7E8D5; --crit:#B3261E; --crit-soft:#F8DEDC;
  --shadow:0 1px 2px rgba(23,34,30,.06),0 4px 14px rgba(23,34,30,.05);
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --surface:#17201B; --surface-2:#1E2923; --ink:#E4EBE7; --muted:#9BA8A1; --line:#2B3831;
    --accent:#72C19D; --accent-ink:#0C1410; --accent-soft:#1D372B;
    --ax1:#72C19D; --ax2:#E3AB53; --ax3:#98A9EA;
    --lv1:#26352D; --lv2:#3C6852; --lv3:#5DA383; --lv4:#95D8B8;
    --ok:#6CC495; --warn:#E6A35A; --warn-soft:#3A2A17; --crit:#F08A80; --crit-soft:#3D1D1A;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#17201B; --surface-2:#1E2923; --ink:#E4EBE7; --muted:#9BA8A1; --line:#2B3831;
  --accent:#72C19D; --accent-ink:#0C1410; --accent-soft:#1D372B;
  --ax1:#72C19D; --ax2:#E3AB53; --ax3:#98A9EA;
  --lv1:#26352D; --lv2:#3C6852; --lv3:#5DA383; --lv4:#95D8B8;
  --ok:#6CC495; --warn:#E6A35A; --warn-soft:#3A2A17; --crit:#F08A80; --crit-soft:#3D1D1A;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);font-size:.85rem;padding:8px 16px;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--display);font-size:1.15rem}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1080px;margin:0 auto;padding:0 16px 8px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:.7rem;margin-left:4px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:progress}
.grid{display:grid;gap:16px}
.grid>*,.section>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.section{display:grid;gap:14px;margin-top:22px}
.stat .v{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.req::after{content:" *";color:var(--crit)}
label.f.req{position:relative}
label.f.req::after{content:"필수";position:absolute;top:1px;right:2px;font-size:.72rem;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.lv{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-family:var(--mono);font-size:.85rem;font-weight:500}
.lvchip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:7px;font-size:.82rem;font-weight:600;white-space:nowrap}
.lv1{background:var(--lv1);color:var(--ink)} .lv2{background:var(--lv2);color:var(--ink)}
.lv3{background:var(--lv3);color:#fff} .lv4{background:var(--lv4);color:#fff}
:root[data-theme="dark"] .lv3,:root[data-theme="dark"] .lv4{color:#0C1410}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv3,:root:not([data-theme="light"]) .lv4{color:#0C1410}}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder span{height:10px;border-radius:3px;background:var(--surface-2)}
.ladder span.on{background:var(--accent)}
.axis-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.85rem;background:var(--surface)}
.scale input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale input:focus-visible+label{outline:2px solid var(--accent)}
.lvgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lvcell{display:grid;gap:4px;align-content:start;padding:10px;border-radius:10px;background:var(--surface-2)}
@media (max-width:760px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.lvgrid{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop.bad{border-color:var(--crit)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:92px;height:70px;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;cursor:pointer;font-size:.7rem}
.timeline{display:grid;gap:14px}
.entry{display:grid;gap:10px}
.entry header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.thread{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.msg{padding:8px 11px;border-radius:10px;background:var(--surface-2);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.admin{background:var(--accent-soft)}
.msg .who{font-size:.75rem;font-weight:600;color:var(--muted);display:block}
.msg.admin .who{color:var(--ok)}
.reply{display:flex;gap:8px;flex-wrap:wrap}
.reply textarea{min-height:44px;flex:1 1 220px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
.t th,.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t th{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.login{max-width:880px;margin:0 auto;padding-block:48px}
.hero{display:grid;gap:10px;margin-bottom:26px}
.hero h1{font-size:2.1rem}
.gas{display:flex;gap:4px}
.gas b{font-family:var(--mono);font-size:.8rem;padding:1px 7px;border-radius:6px;background:var(--surface-2)}
.gas b.on{background:var(--ax2);color:#fff}
dialog{border:0;border-radius:14px;padding:0;max-width:min(92vw,900px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog img{display:block;max-height:80vh}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20}
.rub td{min-width:150px}
.nar td{min-width:150px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:560px){ .axis-row{grid-template-columns:1fr} h1{font-size:1.45rem} .hero h1{font-size:1.7rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* config.js 를 글자로 읽어 url·key 를 뽑습니다. 따옴표가 빠지는 등 입력 실수가 있어도 동작합니다. */
async function loadConfig(){
  let url = CONFIG.SUPABASE_URL, key = CONFIG.SUPABASE_ANON_KEY;
  if(!(url && key) && location.protocol.startsWith("http")){
    try{
      const r = await fetch("config.js", {cache:"no-cache"});
      if(r.ok){
        const t = await r.text();
        const mu = t.match(/url\s*:\s*["'`]?\s*(https:\/\/[A-Za-z0-9.\-]+\.supabase\.co)/);
        const mk = t.match(/key\s*:\s*["'`]?\s*([A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+|sb_publishable_[A-Za-z0-9_\-]+)/);
        if(mu && mk){ url = mu[1]; key = mk[1]; }
      }
    }catch(e){}
  }
  if(url && key && window.supabase){ cloud = true; sb = window.supabase.createClient(url, key); }
}

async function rpc(fn, args={}){
  let res;
  if(cloud){
    const {data,error} = await sb.rpc(fn,args);
    if(error) throw new Error("서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요. ("+error.message+")");
    res = data;
  } else res = Demo[fn](args);
  if(res && res.error) throw new Error(ERR[res.error] || res.error);
  return res ? res.data : null;
}

async function uploadPhoto(teamId, blob, kind="output"){
  if(!cloud) return await blobToDataURL(blob);
  const path = `${teamId}/${kind}/${new Date().toISOString().slice(0,10)}-${uid()}.jpg`;
  const {error} = await sb.storage.from("mm-photos").upload(path, blob, {contentType:"image/jpeg", upsert:false});
  if(error) throw new Error("사진을 올리지 못했습니다: "+error.message);
  return sb.storage.from("mm-photos").getPublicUrl(path).data.publicUrl;
}

const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

const fmtDate = d => { if(!d) return "-"; const [y,m,dd]=d.slice(0,10).split("-"); return `${+m}월 ${+dd}일`; };
const fmtTime = t => { const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const mean = a => { const v=a.filter(x=>typeof x==="number"&&!isNaN(x)); return v.length? v.reduce((p,c)=>p+c,0)/v.length : null; };
const f1 = v => v==null? "-" : v.toFixed(1);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function blobToDataURL(b){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }
async function compress(file, max=cloud?1280:720, q=cloud?.74:.6){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  } finally { URL.revokeObjectURL(url); }
}
function download(name, text, type="text/csv;charset=utf-8"){
  const blob = text instanceof Blob ? text : new Blob([type.startsWith("text/csv")?"﻿"+text:text],{type});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
}

function sessionLevel(s){ const r = Object.keys(s.mentor_rating||{}).length ? s.mentor_rating : s.self_rating; return mean(RUBRIC.map(a=>r?.[a.key])); }
function latestAxis(sessions, key){ for(let i=sessions.length-1;i>=0;i--){ const v=sessions[i].mentor_rating?.[key] ?? sessions[i].self_rating?.[key]; if(v) return v; } return null; }
function levelUps(sessions){
  const best={}, ups={};
  sessions.forEach(s=>{ RUBRIC.forEach(a=>{ const v=s.mentor_rating?.[a.key]; if(!v) return; if(best[a.key]!=null && v>best[a.key]) (ups[s.id]=ups[s.id]||[]).push(a.name+" "+lvName(v)); if(best[a.key]==null||v>best[a.key]) best[a.key]=v; }); });
  return ups;
}
function gap(s){ const d=RUBRIC.map(a=>(s.self_rating?.[a.key]&&s.mentor_rating?.[a.key])? s.self_rating[a.key]-s.mentor_rating[a.key] : null); return mean(d); }

function lvBadge(v){ if(!v) return `<span class="lv" style="background:var(--surface-2)">-</span>`; const r=Math.max(1,Math.min(4,Math.round(v))); return `<span class="lv lv${r}" title="${lvName(r)}">${Number.isInteger(v)?v:v.toFixed(1)}</span>`; }

/* 선 그래프 (SVG) */
function lineChart(series, {h=220, yMin=1, yMax=4, labels=[], yTicks=[1,2,3,4], yFmt=v=>v, left=58}={}){
  const n = Math.max(2, ...series.map(s=>s.values.length));
  const W=600, H=h, L=left, R=16, T=14, B=34;
  const x = i => L + (W-L-R) * (n===1?0.5: i/(n-1));
  const y = v => T + (H-T-B) * (1-(v-yMin)/(yMax-yMin));
  let g = "";
  yTicks.forEach(t=>{ g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="13" fill="var(--muted)">${yFmt(t)}</text>`; });
  const step = Math.ceil(n/10);
  for(let i=0;i<n;i++){ if(i%step && i!==n-1) continue; g += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="13" fill="var(--muted)">${esc(labels[i]??(i+1)+"회")}</text>`; }
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>v==null?null:[x(i),y(v)]);
    let d="", pen=false; pts.forEach(p=>{ if(!p){pen=false;return;} d+=(pen?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "; pen=true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    pts.forEach((p,i)=>{ if(p) g += `<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?s.color:"var(--surface)"}" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} ${labels[i]||""}: ${s.values[i]}</title></circle>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(", "))} 변화 그래프">${g}</svg>`;
}
function legend(series){ return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`; }

function timeline(sessions, admin){
  const all = S.data.comments; const teams = admin? S.data.teams : [S.data.team];
  const ups = {}; teams.forEach(t=>Object.assign(ups, levelUps(sessions.filter(s=>s.team_id===t.id))));
  const list = [...sessions].sort((a,b)=> (b.session_date+b.created_at).localeCompare(a.session_date+a.created_at));
  if(!list.length) return `<div class="card empty section">아직 활동기록이 없습니다.</div>`;
  const team = S.data.team;
  return `<div class="section timeline">${list.map(s=>{
    const t = teams.find(x=>x.id===s.team_id) || {};
    const cs = all.filter(c=>c.session_id===s.id);
    const hasFb = cs.some(c=>c.role==="admin");
    return `<article class="card entry" id="s-${s.id}">
      <header><div><span class="eyebrow">${admin?esc(t.name)+" · ":""}${fmtDate(s.session_date)} · ${s.minutes}분 · ${esc(s.mode)}</span>${s.unit?`<div class="small muted">단원: ${esc(s.unit)}</div>`:""}<h3>${esc(s.topic)}</h3></div>
        <div class="row">${(ups[s.id]||[]).map(u=>`<span class="pill ok">▲ ${esc(u)}</span>`).join("")}
          ${hasFb?`<span class="pill ok">피드백 완료</span>`:`<span class="pill ${admin?"warn":""}">피드백 대기</span>`}
          ${admin?`<button class="btn sm danger" data-act="del-session" data-id="${s.id}">삭제</button>`:""}</div></header>
      ${photoGroups(s)}
      <dl class="kv"><dt>학습 내용</dt><dd>${esc(s.content)}</dd>

        ${s.place?`<dt>장소</dt><dd>${esc(s.place)}</dd>`:""}

        <dt>성장 점검</dt><dd><div class="grid" style="gap:6px">${RUBRIC.map(a=>`<div><span class="small"><b>${a.name}</b>: 나 ${lvChip(s.self_rating?.[a.key])} · 멘토 ${lvChip(s.mentor_rating?.[a.key])}</span>${s.narrative?.[a.key]?`<div class="small">근거: ${esc(s.narrative[a.key])}</div>`:""}</div>`).join("")}</div></dd>
        ${s.narrative?.mentor_note?`<dt>멘토 관찰</dt><dd>${esc(s.narrative.mentor_note)}</dd>`:""}
        ${s.narrative?.next_step?`<dt>다음 단계 준비</dt><dd>${esc(s.narrative.next_step)}</dd>`:""}
        <dt>작성</dt><dd class="small muted">${esc(s.author)} · ${fmtTime(s.created_at)}</dd></dl>
      <div class="thread">
        ${cs.map(c=>`<div class="msg ${c.role==="admin"?"admin":""}"><span class="who">${c.role==="admin"?"교수자":esc(c.author)+(c.role==="mentor"?" (멘토)":" (멘티)")} · ${fmtTime(c.created_at)}</span>${esc(c.body)}</div>`).join("")}

}
function narrativeView(sessions){

    ${rows.map(s=>`<tr><td style="white-space:nowrap">${fmtDate(s.session_date)}<br><span class="small muted">${esc(s.unit||s.topic)}</span></td>${RUBRIC.map(a=>`<td class="small">${s.mentor_rating?.[a.key]?lvChip(s.mentor_rating[a.key])+"<br>":""}${esc(s.narrative?.[a.key]||"")}</td>`).join("")}<td class="small">${esc(s.narrative?.mentor_note||"")}</td><td class="small">${esc(s.narrative?.next_step||"")}</td></tr>`).join("")}

function growthView(team, sessions){
  if(!sessions.length) return `<div class="card empty section">첫 기록을 남기면 성장 그래프가 그려집니다.</div>`;
  const labels = sessions.map(s=>fmtDate(s.session_date).replace("월 ","/").replace("일",""));
  const colors=["var(--ax1)","var(--ax2)","var(--ax3)"];
  const mentor = RUBRIC.map((a,i)=>({name:a.name, color:colors[i], values:sessions.map(s=>s.mentor_rating?.[a.key]??null)}));
  const self = [{name:"멘토 평정 평균",color:"var(--accent)",values:sessions.map(s=>mean(RUBRIC.map(a=>s.mentor_rating?.[a.key])))},
                {name:"멘티 자기평가 평균",color:"var(--ax2)",dash:true,values:sessions.map(s=>mean(RUBRIC.map(a=>s.self_rating?.[a.key])))}];
  const first=sessions[0], last=sessions.at(-1);
  const gasSeries = (team.goals||[]).map((g,i)=>({name:`목표 ${i+1}`,color:colors[i%3],values:sessions.map(s=>s.gas?.[i]??null)}));
  const cmp = s => `<div class="card grid" style="gap:8px"><span class="eyebrow">${s===first?"첫 회기":"최근 회기"} · ${fmtDate(s.session_date)}</span><h3>${esc(s.topic)}</h3>
    ${photoGroups(s)}
    <div class="grid" style="gap:4px">${RUBRIC.map(a=>`<span class="small">${a.name} ${lvChip(s.mentor_rating?.[a.key])}</span>`).join("")}</div></div>`;
  return `<div class="section">
    <div class="card chart grid" style="gap:10px"><div class="row between"><h2>영역별 단계 변화 (멘토 평정)</h2>${legend(mentor)}</div>${lineChart(mentor,{labels,yFmt:lvName, left:150})}</div>
    <div class="grid g2">
      <div class="card chart grid" style="gap:10px"><h2>자기평가와 멘토 평정</h2>${legend(self)}${lineChart(self,{labels,h:200,yFmt:lvName,left:150})}
        <p class="small muted" style="margin:0">두 선의 간격이 좁아질수록 자신의 수준을 정확히 판단하고 있다는 뜻입니다. 최근 차이: ${f1(gap(last))}</p></div>
      ${gasSeries.length?`<div class="card chart grid" style="gap:10px"><h2>학기 목표 달성 척도</h2>${legend(gasSeries)}${lineChart(gasSeries,{labels,h:200,yMin:-2,yMax:2,yTicks:[-2,-1,0,1,2],yFmt:v=>v>0?"+"+v:v})}
        <div class="small muted">${team.goals.map((g,i)=>`목표 ${i+1}: ${esc(g)}`).join("<br>")}</div></div>`:""}
    </div>
    ${narrativeView(sessions)}
    ${sessions.length>1?`<h2>처음과 지금</h2><div class="grid g2">${cmp(first)}${cmp(last)}</div>`:""}
  </div>`;
}

function previewTeam(){
  const d=S.data, t=d.teams.find(x=>x.id===S.viewAs);

function teamStats(t){

  return { ss, n:ss.length, mins:ss.reduce((p,s)=>p+(+s.minutes||0),0), photos:ss.reduce((p,s)=>p+(s.photos||[]).length,0),

document.addEventListener("click", async e=>{
  const tab = e.target.closest("[data-tab]");
  if(tab){ S.tab=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const pv = e.target.closest("[data-pvtab]");
  if(pv){ S.pvTab=pv.dataset.pvtab; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  try{
    if(act==="logout") return logout();
    if(act==="refresh"){ await refresh(); return toast("최신 기록을 불러왔습니다."); }
    if(act==="zoom"){ $("#viewerImg").src=el.src; $("#viewer").showModal(); return; }
    if(act==="pv-open"){ S.viewAs=el.dataset.id; S.pvTab="home"; render(); window.scrollTo(0,0); return; }
    if(act==="pv-exit"){ S.viewAs=null; render(); window.scrollTo(0,0); return; }
    if(act==="exset"){ S.exSet=el.dataset.k; render(); return; }
    if(act==="practice"){ S.practice={...(S.practice||{}),[el.dataset.i]:+el.dataset.v}; store.set(practiceKey(),S.practice); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    if(act==="rm-photo"){ const k=el.dataset.kind; URL.revokeObjectURL(S.draft[k][+el.dataset.i].url); S.draft[k].splice(+el.dataset.i,1); updateThumbs(k); return; }
    if(act==="del-session" && confirm("이 활동기록과 댓글을 삭제할까요?")){ await rpc("mm_admin_delete_session",{p_pin:S.pin,p_id:el.dataset.id}); await refresh(); toast("삭제했습니다."); }
    if(act==="del-team" && confirm("팀과 그 팀의 모든 기록을 삭제할까요? 되돌릴 수 없습니다.")){ await rpc("mm_admin_delete_team",{p_pin:S.pin,p_id:el.dataset.id}); await refresh(); toast("팀을 삭제했습니다."); }
    if(act==="del-notice"){ await rpc("mm_admin_delete_notice",{p_pin:S.pin,p_id:el.dataset.id}); await refresh(); }
    if(act.startsWith("exp-")) await doExport(act, el);
  }catch(err){ toast(err.message); }
});

function thumbsHTML(k){ return S.draft[k].map((p,i)=>`<div><img src="${p.url}" alt="${PHOTO_KINDS[k].label} ${i+1}"><button type="button" data-act="rm-photo" data-kind="${k}" data-i="${i}" aria-label="사진 빼기">✕</button></div>`).join(""); }
async function addPhotos(files, k){
  for(const f of [...files]){
    if(S.draft[k].length>=PHOTO_KINDS[k].max){ toast(`${PHOTO_KINDS[k].label}은 ${PHOTO_KINDS[k].max}장까지 올릴 수 있습니다.`); break; }
    if(!f.type.startsWith("image/")) continue;
    const blob = await compress(f);
    S.draft[k].push({blob, url:URL.createObjectURL(blob)});
  }
  updateThumbs(k);
}
function updateThumbs(k){
  const el=$("#thumbs-"+k); if(!el) return;
  el.innerHTML = thumbsHTML(k);
  $("#drop-"+k).classList.remove("bad");
}

      const self_rating={}, mentor_rating={}, gas={};

    if(kind==="team"){
      const k=form.dataset.id||"new";
      const p={ id:form.dataset.id||null, name:$("#tn-"+k).value.trim(), pin:$("#tp-"+k).value.trim(), mentor:$("#tm-"+k).value.trim(), mentee:$("#te-"+k).value.trim(),

      const t = await rpc("mm_admin_save_team",{p_pin:S.pin,p}); ping(t.id); await refresh();
      toast(p.id? "저장했습니다." : `팀을 만들었습니다. 팀 코드 ${t.code} · PIN ${p.pin} 을 학생에게 알려 주세요.`);
    }
    if(kind==="notice"){
      const team=$("#n-team").value||null;
      await rpc("mm_admin_notice",{p_pin:S.pin,p_team:team,p_body:$("#n-body").value.trim()}); ping(team); await refresh(); toast("공지를 보냈습니다.");
    }
    if(kind==="purge"){
      if($("#purge-txt").value!=="학기종료") throw new Error("확인 문구 '학기종료'를 정확히 입력해 주세요.");
      if(!confirm("모든 팀·기록·피드백을 삭제합니다. 내보내기를 마쳤나요?")) return;
      await rpc("mm_admin_purge",{p_pin:S.pin,p_confirm:"학기종료"}); await refresh(); toast("모든 기록을 삭제했습니다. 사진 저장소도 비워 주세요.");
    }
  }catch(err){ toast(err.message); const st=$("#w-status"); if(st) st.textContent=""; }
  finally{ if(btn && document.contains(btn)) btn.disabled=false; }
});

async function doExport(act, el){
  const {teams,sessions,comments} = S.data; const tn = id => teams.find(t=>t.id===id)?.name||"";
  const stamp = today();
  if(act==="exp-sessions"){
    const head=["팀","날짜","시간(분)","방식","장소","공부한단원","주제","학습내용","어려웠던점","다음계획","산출물","사진수","사진주소",
      ...RUBRIC.flatMap(a=>[a.name+"_자기",a.name+"_멘토",a.name+"_근거"]),"멘토관찰","다음단계준비","GAS1","GAS2","GAS3","작성자","작성시각"];
    const rows=sessions.map(s=>[tn(s.team_id),s.session_date,s.minutes,s.mode,s.place,s.unit||"",s.topic,s.content,s.difficulty,s.next_plan,s.output_link,(s.photos||[]).length,cloud?(s.photos||[]).map(p=>(pKind(p)==="face"?"인증:":"결과물:")+pUrl(p)).join(" "):"(시연 모드)",
      ...RUBRIC.flatMap(a=>[s.self_rating?.[a.key]??"",s.mentor_rating?.[a.key]??"",s.narrative?.[a.key]??""]), s.narrative?.mentor_note??"", s.narrative?.next_step??"", s.gas?.[0]??"", s.gas?.[1]??"", s.gas?.[2]??"", s.author, s.created_at]);
    download(`활동기록_${stamp}.csv`, toCSV([head,...rows]));
  }
  if(act==="exp-comments"){
    const rows=comments.map(c=>{ const s=sessions.find(x=>x.id===c.session_id)||{}; return [tn(c.team_id),s.session_date,s.topic,c.role==="admin"?"교수자":c.role==="mentor"?"멘토":"멘티",c.author,c.body,c.created_at]; });
    download(`피드백_${stamp}.csv`, toCSV([["팀","기록날짜","기록주제","역할","작성자","내용","작성시각"],...rows]));
  }
  if(act==="exp-summary"){
    const rows=teams.map(t=>{ const x=teamStats(t); return [t.name,t.topic,EXAMPLES[exSetOf(t)].label,t.mentor,t.mentee,x.n,x.mins,x.photos,x.last||"",x.first==null?"":x.first.toFixed(2),x.cur==null?"":x.cur.toFixed(2),x.gap==null?"":x.gap.toFixed(2),x.fb,x.replies,x.pending,(t.goals||[]).join(" / ")]; });
    download(`팀별요약_${stamp}.csv`, toCSV([["팀","주제","예시영역","멘토","멘티","회기수","누적분","사진수","마지막활동","첫회기단계","현재단계","자기-멘토차이","교수자피드백수","학생답글수","피드백대기","학기목표"],...rows]));
  }
  if(act==="exp-json") download(`동행기록_백업_${stamp}.json`, JSON.stringify({exported_at:new Date().toISOString(),rubric:RUBRIC,...S.data},null,2), "application/json");
  if(act==="exp-zip"){
    if(!window.JSZip) throw new Error("압축 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
    const st=$("#zip-status"); const zip=new JSZip(); let i=0; const total=sessions.reduce((p,s)=>p+(s.photos||[]).length,0);
    el.disabled=true;
    for(const s of sessions){ for(const [k,ph] of (s.photos||[]).entries()){ const url=pUrl(ph);
      i++; st.textContent=`사진 모으는 중 ${i}/${total}`;
      try{ const b = await (await fetch(url)).blob(); zip.file(`${tn(s.team_id)}/${s.session_date}_${(s.topic||"").slice(0,20).replace(/[\\/:*?"<>|]/g,"")}_${pKind(ph)==="face"?"인증":"결과물"}${k+1}.jpg`, b); }catch(_){}
    }}
    st.textContent="압축하는 중…";
    download(`활동사진_${stamp}.zip`, await zip.generateAsync({type:"blob"}), "application/zip");
    st.textContent=`사진 ${total}장을 압축했습니다.`; el.disabled=false;
  }
}

function demoPhoto(label, hue){
  try{
    const c=document.createElement("canvas"); c.width=480; c.height=360; const g=c.getContext("2d");
    const gr=g.createLinearGradient(0,0,480,360); gr.addColorStop(0,`hsl(${hue} 32% 78%)`); gr.addColorStop(1,`hsl(${hue+30} 30% 58%)`);
    g.fillStyle=gr; g.fillRect(0,0,480,360);
    g.fillStyle="rgba(255,255,255,.85)"; g.fillRect(60,70,220,160); g.fillRect(300,110,120,150);
    g.fillStyle=`hsl(${hue} 30% 35%)`; for(let i=0;i<6;i++) g.fillRect(80,95+i*22,150-(i%3)*30,8);
    g.fillStyle="rgba(0,0,0,.55)"; g.fillRect(0,300,480,60);
    g.fillStyle="#fff"; g.font="bold 22px sans-serif"; g.fillText("시연용 활동 사진 · "+label,20,338);
    return c.toDataURL("image/jpeg",.7);
  }catch(e){ return ""; }
}
